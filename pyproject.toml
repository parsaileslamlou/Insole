# Editable install of the `insole` package so the tests, the scripts and the
# notebooks import it from any working directory:
#
#     pip install -e .            # library modules only (numpy, pandas)
#     pip install -e .[hw]        # + pyserial, bleak for live capture
#     pip install -e .[analysis]  # + matplotlib, scipy, scikit-learn
#     pip install -e .[test]      # + pytest
#     pip install -e .[notebook]  # + nbformat, nbconvert, ipykernel, pillow
#
# Layout: insole/ is the package (everything a test or another module imports),
# scripts/ holds programs that are only run, tests/ the tests, notebooks/ the
# notebooks, models/ the persisted gain match and classifiers. Programs in the
# package run as `python -m insole.<module>`; programs in scripts/ run as
# `python scripts/<name>.py`. Both resolve repository paths through
# insole/paths.py, never through the working directory.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "insole"
version = "0.16.0"
description = "Instrumented insole: capture, stance detection, features, classification"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
]

[project.optional-dependencies]
hw = ["pyserial", "bleak"]
analysis = ["matplotlib", "scipy", "scikit-learn"]
test = ["pytest"]
notebook = ["nbformat", "nbconvert", "ipykernel", "pillow", "matplotlib"]

[tool.setuptools.packages.find]
include = ["insole*"]

[tool.pytest.ini_options]
# The test scripts double as pytest modules. Run from the repo root:
#     python -m pytest -q
# or run any one directly for its PASS/FAIL line output:
#     python tests/test_stances.py
testpaths = ["tests"]
python_files = ["test_*.py"]
