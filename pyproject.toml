# Minimal packaging so the flat-layout modules import from any working
# directory without sys.path games:
#
#     pip install -e .            # library modules only (numpy, pandas)
#     pip install -e .[hw]        # + pyserial, bleak for live capture
#     pip install -e .[analysis]  # + matplotlib, scipy, scikit-learn
#     pip install -e .[test]      # + pytest
#
# This is an editable install of the modules listed under py-modules; there
# is no src/ or package directory and none is intended (repo consolidation is
# a later stage). Scripts that run at import time (bakeoff.py, analyze_real.py,
# sim_vs_real.py, capture_*.py, fit_*.py) are not listed: they are run, not
# imported, and they still expect to be run from the repo root because they
# read files by relative path.
#
# Without the install, the run-from-root invariant still holds: every module
# here imports its siblings by bare name, which works whenever the repo root
# is the current directory or is on PYTHONPATH.
[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "insole"
version = "0.14.0"
description = "Instrumented insole: capture, stance detection, features, classification"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
]

[project.optional-dependencies]
hw = ["pyserial", "bleak"]
analysis = ["matplotlib", "scipy", "scikit-learn"]
test = ["pytest"]

[tool.setuptools]
py-modules = [
    "calibration",
    "detector",
    "discriminant",
    "features",
    "gait_gen",
    "heatmap",
    "make_sessions",
    "read_serial",
    "infer_live",
    "fit_model",
]

[tool.pytest.ini_options]
# The test scripts double as pytest modules. Run from the repo root:
#     python -m pytest -q
# or run any one directly for its PASS/FAIL line output:
#     python test_stances.py
testpaths = ["."]
python_files = ["test_*.py"]
